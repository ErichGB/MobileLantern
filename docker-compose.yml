services:
  hugo:
    image: klakegg/hugo:ext-ubuntu-ci
    command: sh -c "npm install && npm run start"
#    command: sh -c "npm install && npx tailwindcss -i ./assets/css/main.css -o ./assets/css/style.css & hugo server --bind 0.0.0.0 --baseURL http://localhost:1313/ --appendPort=false"
    volumes:
      - ".:/src"
    ports:
      - "1313:1313"
    environment:
      - HUGO_ENV=development

