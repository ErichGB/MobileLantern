<header class="border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative">
    <div class="flex justify-between items-center h-14">
      <!-- Logo and Name -->
      <div class="flex items-center space-x-3">
        <a href="{{ "/" | relURL }}" class="flex items-center space-x-2">
          <span class="text-lg">🚨</span>
          <span class="text-lg font-semibold text-slate-900 dark:text-white">{{ .Site.Title }}</span>
        </a>
      </div>

      <!-- Navigation -->
      <nav class="hidden md:flex items-center space-x-8">
        <a href="{{ "/" | relURL }}" class="text-sm font-medium text-slate-700 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white transition-colors">
          {{ i18n "home" }}
        </a>
        <a href="{{ "/manual" | relURL }}" class="text-sm font-medium text-slate-700 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white transition-colors">
          {{ i18n "manual" }}
        </a>
        <a href="{{ "/qr-generator" | relURL }}" class="text-sm font-medium text-slate-700 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white transition-colors">
          {{ i18n "qr_generator" }}
        </a>
      </nav>

      <!-- Mobile menu button -->
      <button id="mobile-menu-button" class="md:hidden p-2 text-slate-700 dark:text-slate-300">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
    </div>

    <!-- Mobile menu -->
    <div id="mobile-menu" class="hidden md:hidden absolute top-14 left-0 right-0 bg-white dark:bg-slate-950 border-b border-slate-200 dark:border-slate-800 pb-4 px-4 sm:px-6 lg:px-8 space-y-2 shadow-lg">
      <a href="{{ "/" | relURL }}" class="block px-3 py-2 text-sm font-medium text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded transition-colors">
        {{ i18n "home" }}
      </a>
      <a href="{{ "/manual" | relURL }}" class="block px-3 py-2 text-sm font-medium text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded transition-colors">
        {{ i18n "manual" }}
      </a>
      <a href="{{ "/qr-generator" | relURL }}" class="block px-3 py-2 text-sm font-medium text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded transition-colors">
        {{ i18n "qr_generator" }}
      </a>
    </div>
  </div>
</header>

<script>
  document.getElementById('mobile-menu-button')?.addEventListener('click', function() {
    const menu = document.getElementById('mobile-menu');
    menu?.classList.toggle('hidden');
  });
</script>
