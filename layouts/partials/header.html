<header class="border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 sticky top-0 z-50" 
        x-data="{
          currentPath: '{{ .RelPermalink }}',
          version: null,
          downloadUrl: null,
          loading: true,
          async init() {
            const cached = localStorage.getItem('appRelease');
            const cacheTime = localStorage.getItem('appReleaseTime');
            const now = Date.now();
            
            if (cached && cacheTime && (now - parseInt(cacheTime)) < 3600000) {
              const data = JSON.parse(cached);
              this.version = data.version;
              this.downloadUrl = data.downloadUrl;
              this.loading = false;
              return;
            }
            
            try {
              const response = await fetch('https://api.github.com/repos/ErichGB/MobileLantern/releases/latest');
              const release = await response.json();
              const apkAsset = release.assets.find(asset => asset.name.endsWith('.apk'));
              
              if (apkAsset) {
                this.version = release.tag_name.replace('v', '').replace('-android', '');
                this.downloadUrl = apkAsset.browser_download_url;
                
                localStorage.setItem('appRelease', JSON.stringify({
                  version: this.version,
                  downloadUrl: this.downloadUrl
                }));
                localStorage.setItem('appReleaseTime', now.toString());
              }
            } catch (error) {
              console.error('Error fetching release:', error);
            } finally {
              this.loading = false;
            }
          },
          download() {
            if (this.downloadUrl) {
              window.open(this.downloadUrl, '_blank');
            }
          }
        }">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8 relative">
    <div class="flex justify-between items-center h-14">
      <!-- Logo and Name -->
      <div class="flex items-center space-x-3">
        <a href="{{ "/" | relURL }}" class="flex items-center space-x-2">
          <span class="text-lg">🚨</span>
          <span class="text-lg font-semibold text-slate-900 dark:text-white">{{ .Site.Title }}</span>
        </a>
      </div>

      <!-- Navigation -->
      <nav class="flex items-center space-x-4 sm:space-x-8">
        <a href="{{ "/manual" | relURL }}" 
           x-cloak
           x-show="!currentPath.includes('/manual')"
           x-transition:enter="transition ease-out duration-200"
           x-transition:enter-start="opacity-0 -translate-y-1"
           x-transition:enter-end="opacity-100 translate-y-0"
           x-transition:leave="transition ease-in duration-150"
           x-transition:leave-start="opacity-100 translate-y-0"
           x-transition:leave-end="opacity-0 -translate-y-1"
           class="text-sm font-medium text-slate-700 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white transition-colors">
          {{ i18n "manual" }}
        </a>
        <a href="{{ "/qr-generator" | relURL }}" 
           x-cloak
           x-show="!currentPath.includes('/qr-generator')"
           x-transition:enter="transition ease-out duration-200"
           x-transition:enter-start="opacity-0 -translate-y-1"
           x-transition:enter-end="opacity-100 translate-y-0"
           x-transition:leave="transition ease-in duration-150"
           x-transition:leave-start="opacity-100 translate-y-0"
           x-transition:leave-end="opacity-0 -translate-y-1"
           class="text-sm font-medium text-slate-700 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white transition-colors">
          {{ i18n "qr_generator" }}
        </a>
        
        <div x-cloak 
             x-show="!loading && version" 
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0 scale-95"
             x-transition:enter-end="opacity-100 scale-100"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="opacity-100 scale-100"
             x-transition:leave-end="opacity-0 scale-95"
             class="flex items-center space-x-2 px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors cursor-pointer"
             @click="download()"
             title="Descargar versión">
          <span class="hidden sm:inline text-xs font-medium text-slate-600 dark:text-slate-400">v<span x-text="version"></span></span>
          <svg class="w-4 h-4 text-slate-600 dark:text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
          </svg>
        </div>
      </nav>
    </div>
  </div>
</header>
