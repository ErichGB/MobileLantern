{{ $themeToggle := resources.Get "js/theme-toggle.js" | js.Build }}
<script type="module" src="{{ $themeToggle.Permalink }}" defer></script>

<footer class="border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 mt-auto">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div class="flex flex-col md:flex-row justify-between items-center space-y-4 md:space-y-0">
      <!-- Left: Theme Toggle -->
      <div class="flex items-center space-x-2">
        <div id="theme-toggle-group" class="flex items-center bg-slate-100 dark:bg-slate-800 rounded-md p-1">
          <button data-theme="light" class="flex-1 sm:flex-none flex items-center justify-center px-4 py-2 sm:px-2 sm:py-1 text-sm sm:text-xs font-medium rounded transition-colors">
            <svg class="w-4 h-4 sm:w-3 sm:h-3 mr-2 sm:mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
            </svg>
            {{ i18n "theme_light" }}
          </button>
          <button data-theme="dark" class="flex-1 sm:flex-none flex items-center justify-center px-4 py-2 sm:px-2 sm:py-1 text-sm sm:text-xs font-medium rounded transition-colors">
            <svg class="w-4 h-4 sm:w-3 sm:h-3 mr-2 sm:mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
            </svg>
            {{ i18n "theme_dark" }}
          </button>
          <button data-theme="auto" class="flex-1 sm:flex-none flex items-center justify-center px-4 py-2 sm:px-2 sm:py-1 text-sm sm:text-xs font-medium rounded transition-colors">
            <svg class="w-4 h-4 sm:w-3 sm:h-3 mr-2 sm:mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
            </svg>
            {{ i18n "theme_auto" }}
          </button>
        </div>
          <!-- Keyboard Shortcuts - Hidden on mobile -->
          <div class="hidden sm:flex items-center text-xs text-slate-500 dark:text-slate-400">
              <div class="flex items-center space-x-1">
                  <kbd class="px-1.5 py-0.5 bg-slate-100 dark:bg-slate-800 rounded text-xs font-mono">⌘T</kbd>
                  <span>{{ i18n "shortcut_theme" }}</span>
              </div>
          </div>
      </div>

      <!-- Right: Links -->
      <div class="flex items-center space-x-2">
          <!-- Center: Copyright -->
          <div class="text-sm text-slate-600 dark:text-slate-400">
              &copy; {{ now.Year }} {{ .Site.Params.author }} - {{ .Site.Title }}
          </div>
        <a href="{{ .Site.Params.github }}" target="_blank" rel="noopener noreferrer" class="text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-colors">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd" />
          </svg>
        </a>
      </div>
    </div>
  </div>
</footer>
