<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ .Site.Title }} - {{ .Site.Params.description }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta name="author" content="{{ .Site.Params.author }}">
  
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="{{ "favicon/favicon.ico" | absURL }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ "favicon/favicon-32x32.png" | absURL }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ "favicon/favicon-16x16.png" | absURL }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ "favicon/apple-touch-icon.png" | absURL }}">
  <link rel="manifest" href="{{ "favicon/site.webmanifest" | absURL }}">
  <link rel="mask-icon" href="{{ "favicon/safari-pinned-tab.svg" | absURL }}" color="#000000">
  <meta name="msapplication-config" content="{{ "favicon/browserconfig.xml" | absURL }}">
  <meta name="theme-color" content="#ffffff">
  
  <!-- CSS -->
  {{ $css := resources.Get "css/style.css" }}
  <link rel="stylesheet" href="{{ $css.Permalink }}">
  
  <!-- Dark mode script (before body render to avoid flash) -->
  <script>
    // Check theme preference before page loads
    const theme = localStorage.getItem('theme') || 'auto';
    if (theme === 'dark' || (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>
  
  <!-- Alpine.js Store (before Alpine.js loads) -->
  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.store('download', {
        version: null,
        downloadUrl: null,
        loading: true,
        initialized: false,
        
        async init() {
          if (this.initialized) return;
          this.initialized = true;
          
          const cached = localStorage.getItem('appRelease');
          const cacheTime = localStorage.getItem('appReleaseTime');
          const now = Date.now();
          
          if (cached && cacheTime && (now - parseInt(cacheTime)) < 3600000) {
            const data = JSON.parse(cached);
            this.version = data.version;
            this.downloadUrl = data.downloadUrl;
            this.loading = false;
            return;
          }
          
          try {
            const response = await fetch('https://api.github.com/repos/ErichGB/ErichGB.github.io/releases/latest');
            const release = await response.json();
            const apkAsset = release.assets.find(asset => asset.name.endsWith('.apk'));
            
            if (apkAsset) {
              this.version = release.tag_name.replace('v', '').replace('-android', '');
              this.downloadUrl = apkAsset.browser_download_url;
              
              localStorage.setItem('appRelease', JSON.stringify({
                version: this.version,
                downloadUrl: this.downloadUrl
              }));
              localStorage.setItem('appReleaseTime', now.toString());
            }
          } catch (error) {
            console.error('Error fetching release:', error);
          } finally {
            this.loading = false;
          }
        },
        
        download() {
          if (this.downloadUrl) {
            window.open(this.downloadUrl, '_blank');
          }
        }
      });
    });
  </script>
  
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</head>
