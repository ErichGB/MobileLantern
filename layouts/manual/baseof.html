<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
{{ partial "head.html" . }}
<body class="bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
  {{ partial "header.html" . }}
  
  <div class="flex-1 flex">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
      <!-- Mobile Menu Button - Hidden -->
      <button id="manual-mobile-menu-button" class="hidden fixed top-20 left-4 z-40 p-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-md shadow-sm text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors" aria-label="Abrir menú del manual">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
      
      <div class="flex gap-8">

        <!-- Mobile Sidebar Overlay -->
        <div id="manual-mobile-overlay" class="lg:hidden fixed inset-0 bg-black bg-opacity-50 z-30 hidden"></div>

        <!-- Sidebar (Desktop) -->
        <div class="hidden lg:block">
          {{ partial "sidebar.html" . }}
        </div>

        <!-- Mobile Sidebar -->
        <aside id="manual-mobile-sidebar" class="lg:hidden fixed top-0 left-0 h-full w-64 bg-white dark:bg-slate-950 border-r border-slate-200 dark:border-slate-800 z-40 transform -translate-x-full transition-transform duration-300 ease-in-out overflow-y-auto">
          <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
            <h2 class="text-lg font-semibold text-slate-900 dark:text-white">{{ i18n "manual" }}</h2>
            <button id="manual-mobile-close" class="p-2 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-md transition-colors" aria-label="Cerrar menú">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
              </svg>
            </button>
          </div>
          <div class="p-4">
            {{ partial "sidebar.html" . }}
          </div>
        </aside>
        
        <!-- Main Content -->
        <main class="flex-1 min-w-0 lg:ml-0 pt-2 lg:pt-0">
          {{ block "main" . }}{{ end }}
        </main>
        
        <!-- Table of Contents (on this page) -->
        {{ if .TableOfContents }}
        <aside class="hidden xl:block w-64 flex-shrink-0">
          <div class="sticky top-20">
            <h3 class="text-xs font-semibold text-slate-900 dark:text-white uppercase tracking-wide mb-3">
              {{ i18n "on_this_page" }}
            </h3>
            <div class="text-sm toc-content">
              {{ .TableOfContents }}
            </div>
          </div>
        </aside>
        {{ end }}
      </div>
    </div>
  </div>
  
  {{ partial "footer.html" . }}

  <script>
    // Mobile menu toggle
    const mobileMenuButton = document.getElementById('manual-mobile-menu-button');
    const mobileSidebar = document.getElementById('manual-mobile-sidebar');
    const mobileOverlay = document.getElementById('manual-mobile-overlay');
    const mobileClose = document.getElementById('manual-mobile-close');

    function openMobileMenu() {
      mobileSidebar.classList.remove('-translate-x-full');
      mobileOverlay.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeMobileMenu() {
      mobileSidebar.classList.add('-translate-x-full');
      mobileOverlay.classList.add('hidden');
      document.body.style.overflow = '';
    }

    mobileMenuButton?.addEventListener('click', openMobileMenu);
    mobileClose?.addEventListener('click', closeMobileMenu);
    mobileOverlay?.addEventListener('click', closeMobileMenu);

    // Close on escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !mobileSidebar.classList.contains('-translate-x-full')) {
        closeMobileMenu();
      }
    });
  </script>
</body>
</html>
