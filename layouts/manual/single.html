{{ define "main" }}
<div class="max-w-4xl">
  <!-- Main Content -->
  <article class="prose prose-slate dark:prose-invert max-w-none prose lg:prose-lg">
    <div class="prose-content">
      {{ .Content }}
    </div>
  </article>
  
  <!-- Navigation -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mt-12 pt-8 border-t border-slate-200 dark:border-slate-800 not-prose">
    <div>
      {{ with .PrevInSection }}
        <a href="{{ .Permalink }}" class="inline-flex items-center text-sm font-medium text-slate-700 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white transition-colors">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
          </svg>
          <span class="hidden sm:inline">{{ i18n "previous" }}: </span>{{ .Title }}
        </a>
      {{ else }}
        <span class="text-sm text-slate-400 dark:text-slate-600">{{ i18n "previous" }}: -</span>
      {{ end }}
    </div>
    <div>
      {{ with .NextInSection }}
        <a href="{{ .Permalink }}" class="inline-flex items-center text-sm font-medium text-slate-700 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white transition-colors">
          <span class="hidden sm:inline">{{ i18n "next" }}: </span>{{ .Title }}
          <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
          </svg>
        </a>
      {{ else }}
        <span class="text-sm text-slate-400 dark:text-slate-600">{{ i18n "next" }}: -</span>
      {{ end }}
    </div>
  </div>
</div>
{{ end }}
